<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cricket Academy Manager</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}header{background:#17365d;color:#fff;padding:16px}main{max-width:1250px;margin:auto;padding:14px}.nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;position:sticky;top:0;z-index:2}.nav button{background:#eef3f9;color:#17365d;white-space:nowrap}.nav button.on{background:#17365d;color:#fff}.card{background:#fff;padding:16px;border-radius:14px;border:1px solid #dde4ee;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{font-size:24px;font-weight:800;margin-top:5px}input,select{padding:10px;width:100%;box-sizing:border-box;margin:5px 0 10px;border:1px solid #ccd6e3;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#17365d;color:white;font-weight:700;cursor:pointer}.danger{background:#c62828}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px;white-space:nowrap}th{background:#edf3f9}.page{display:none}.page.on{display:block}.login{max-width:380px;margin:60px auto}.hidden{display:none}.wa{background:#e7f7ee;color:#137443;padding:7px;border-radius:7px;text-decoration:none}.muted{color:#65748b;font-size:12px}.badge{padding:5px 8px;border-radius:99px;background:#eef3f9;font-size:12px}.ok{background:#e7f7ee;color:#137443}.pending{background:#fff0f0;color:#b42318}.warning{background:#fff8e1;color:#8a5b00}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar>div{min-width:180px;flex:1}.notice{padding:10px 12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}.card{padding:12px}}
</style></head><body>
<div id="login" class="login card"><h2>🔐 Cricket Academy Manager</h2><p class="muted">Secure Admin / Staff Login</p><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Login</button><p id="err"></p></div>
<div id="app" class="hidden"><header><b>🏏 Cricket Academy Manager</b><button style="float:right" onclick="logout()">Logout</button><div id="who" style="font-size:12px;margin-top:5px"></div></header>
<div class="nav" id="nav"></div><main>
<section id="dash" class="page on"></section>
<section id="students" class="page"></section>
<section id="fees" class="page"></section>
<section id="reminders" class="page"></section>
<section id="staff" class="page"></section>
<section id="staffatt" class="page"></section>
</main></div>
<script>
const $=x=>document.getElementById(x), money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
let ME=null, currentMonth=new Date().toISOString().slice(0,7);
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});ME=d;renderShell();loadAll()}catch(e){$('err').textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function start(){try{ME=await api('/api/me');renderShell();loadAll()}catch{}}
function renderShell(){
 $('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Logged in: '+ME.username+' ('+(ME.role==='admin'?'Admin':'Staff')+')';
 const items=ME.role==='admin'?[['dash','Dashboard'],['students','Students'],['fees','Fees & Income'],['reminders','Fee Reminders'],['staff','Staff'],['staffatt','Staff Attendance']]:[['dash','Dashboard'],['students','Students'],['staffatt','My Attendance']];
 $('nav').innerHTML=items.map((x,i)=>`<button data-p="${x[0]}" class="${i===0?'on':''}">${x[1]}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(b.dataset.p).classList.add('on')});
 buildPages();
}
function buildPages(){
 if(ME.role==='admin'){
 $('dash').innerHTML=`<div class="toolbar"><div><label>Financial Month</label><input id="dashMonth" type="month" value="${currentMonth}" onchange="currentMonth=this.value;dash();students()"></div></div><div class="grid"><div class="card">Total Students<div id="total" class="stat">0</div></div><div class="card">Active Students<div id="active" class="stat">0</div></div><div class="card">Month Due<div id="monthDue" class="stat">₹0</div></div><div class="card">Month Collected<div id="collected" class="stat">₹0</div></div><div class="card">Month Pending<div id="pending" class="stat">₹0</div></div></div><div class="card"><b>Admin only</b><p class="muted">Income, collection, pending fees and financial reports are visible only to Admin.</p><span class="badge">Active Staff: <b id="staffcount">0</b></span></div>`;
 $('students').innerHTML=`<div class="card"><h3>Add Student</h3><input id="sid" placeholder="Student ID"><input id="sname" placeholder="Student name"><input id="parent" placeholder="Parent name"><input id="mobile" placeholder="Mobile"><input id="batch" placeholder="Batch"><input id="fee" type="number" placeholder="Monthly fee"><button onclick="addStudent()">Add Student</button></div><div class="card"><h3>Students</h3><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Name</th><th>Parent</th><th>Mobile</th><th>Batch</th><th>Monthly Fee</th><th></th></tr></thead><tbody id="studentRows"></tbody></table></div></div>`;
 $('fees').innerHTML=`<div class="card"><h3>💰 Record Monthly Fee</h3><div class="notice">Only Admin can view or enter fee/income data.</div><select id="fs"></select><input id="month" type="month" value="${currentMonth}"><input id="due" type="number" placeholder="Due amount"><input id="paid" type="number" placeholder="Paid amount"><input id="dueDate" type="date"><input id="paymentDate" type="date"><input id="feeRemarks" placeholder="Remarks"><button onclick="addFee()">Save Fee</button></div><div class="card"><h3>Month-wise Fee Records</h3><div style="overflow:auto"><table><thead><tr><th>Month</th><th>Student</th><th>Due</th><th>Paid</th><th>Pending</th><th>Due Date</th></tr></thead><tbody id="feeRows"></tbody></table></div></div>`;
 $('reminders').innerHTML=`<div class="card"><h3>📲 Fee Reminder</h3><input id="rdate" type="date"><button onclick="reminders()">Show Pending</button><div style="overflow:auto"><table><thead><tr><th>Month</th><th>Student</th><th>Parent</th><th>Mobile</th><th>Pending</th><th></th></tr></thead><tbody id="rem"></tbody></table></div></div>`;
 $('staff').innerHTML=`<div class="card"><h3>Add Staff Login</h3><p class="muted">Admin creates the staff account here. Staff will not get access to academy income or fee totals.</p><input id="stname" placeholder="Staff name"><input id="stmobile" placeholder="Mobile"><input id="strole" placeholder="Role (Coach/Umpire/Office)"><input id="stjoin" type="date"><input id="stuser" placeholder="Login username"><input id="stpass" type="password" placeholder="Login password (min 8 chars)"><button onclick="addStaff()">Create Staff</button></div><div class="card"><h3>Staff List</h3><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Mobile</th><th>Role</th><th>Joining</th><th>Status</th><th>Login</th><th></th></tr></thead><tbody id="staffRows"></tbody></table></div></div>`;
 $('staffatt').innerHTML=`<div class="card"><h3>👥 Staff Attendance</h3><input id="attdate" type="date"><select id="attstaff"></select><select id="attstatus"><option>Present</option><option>Absent</option><option>Leave</option><option>Half Day</option></select><input id="checkin" type="time"><input id="checkout" type="time"><input id="attremarks" placeholder="Remarks"><button onclick="markStaffAttendance()">Save / Update Attendance</button></div><div class="card"><h3>Attendance Report</h3><input id="reportdate" type="date"><button onclick="loadAttendance()">Show Date</button><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Staff</th><th>Role</th><th>Status</th><th>In</th><th>Out</th><th>Remarks</th></tr></thead><tbody id="attRows"></tbody></table></div></div>`;
 } else {
 $('dash').innerHTML=`<div class="card"><h2>Staff Dashboard</h2><div class="notice">🔒 Financial information is restricted to Admin.</div><div class="grid"><div class="card">Total Students<div id="total" class="stat">0</div></div><div class="card">Active Students<div id="active" class="stat">0</div></div></div><p class="muted">You can check whether a student's payment is Paid / Pending / Not Recorded. Academy income and total pending amount are hidden.</p></div>`;
 $('students').innerHTML=`<div class="card"><h3>Student Payment Status</h3><label>Month</label><input id="staffMonth" type="month" value="${currentMonth}" onchange="currentMonth=this.value;students()"><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Student</th><th>Batch</th><th>Payment Status</th><th>Pending</th></tr></thead><tbody id="studentRows"></tbody></table></div></div>`;
 $('staffatt').innerHTML=`<div class="card"><h3>My Attendance</h3><input id="attdate" type="date"><select id="attstatus"><option>Present</option><option>Absent</option><option>Leave</option><option>Half Day</option></select><input id="checkin" type="time"><input id="checkout" type="time"><input id="attremarks" placeholder="Remarks"><button onclick="markMyAttendance()">Save Attendance</button></div><div class="card"><h3>My Attendance History</h3><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Status</th><th>In</th><th>Out</th><th>Remarks</th></tr></thead><tbody id="attRows"></tbody></table></div></div>`;
 }
}
async function loadAll(){await Promise.all([dash(),students(),ME.role==='admin'?fees():Promise.resolve(),ME.role==='admin'?staff():Promise.resolve(),loadAttendance()]);}
async function dash(){let d=await api('/api/dashboard?month='+encodeURIComponent(currentMonth));$('total').textContent=d.total;$('active').textContent=d.active;if(ME.role==='admin'){$('monthDue').textContent=money(d.due);$('collected').textContent=money(d.collected);$('pending').textContent=money(d.pending);$('staffcount').textContent=d.staff}}
async function students(){let url='/api/students?month='+encodeURIComponent(currentMonth),s=await api(url);if(ME.role==='admin'){$('studentRows').innerHTML=s.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.parent||'')}</td><td>${esc(x.mobile||'')}</td><td>${esc(x.batch||'')}</td><td>${money(x.monthly_fee)}</td><td><button class="danger" onclick="delStudent('${encodeURIComponent(x.id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=7>No students</td></tr>';$('fs').innerHTML=s.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.id)})</option>`).join('')}else{$('studentRows').innerHTML=s.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.batch||'')}</td><td><span class="badge ${x.paymentStatus==='Paid'?'ok':x.paymentStatus==='Pending'?'pending':'warning'}">${x.paymentStatus}</span></td><td>${x.pending?money(x.pending):'—'}</td></tr>`).join('')||'<tr><td colspan=5>No students</td></tr>'}}
async function addStudent(){await api('/api/students',{method:'POST',body:JSON.stringify({id:$('sid').value,name:$('sname').value,parent:$('parent').value,mobile:$('mobile').value,batch:$('batch').value,monthly_fee:$('fee').value})});loadAll()}
async function delStudent(id){if(confirm('Delete student and all fee records?')){await api('/api/students/'+decodeURIComponent(id),{method:'DELETE'});loadAll()}}
async function fees(){let f=await api('/api/fees');$('feeRows').innerHTML=f.map(x=>`<tr><td>${esc(x.month||'')}</td><td>${esc(x.name)}</td><td>${money(x.due_amount)}</td><td>${money(x.paid_amount)}</td><td>${money(Math.max(0,x.due_amount-x.paid_amount))}</td><td>${esc(x.due_date||'')}</td></tr>`).join('')||'<tr><td colspan=6>No fee records</td></tr>'}
async function addFee(){await api('/api/fees',{method:'POST',body:JSON.stringify({student_id:$('fs').value,month:$('month').value,due_amount:$('due').value,paid_amount:$('paid').value,due_date:$('dueDate').value,payment_date:$('paymentDate').value,remarks:$('feeRemarks').value})});currentMonth=$('month').value;loadAll();alert('Fee saved')}
async function reminders(){let r=await api('/api/reminders?date='+encodeURIComponent($('rdate').value));$('rem').innerHTML=r.map(x=>{let ph=String(x.mobile||'').replace(/\D/g,'');if(ph.length===10)ph='91'+ph;let m=`Namaste ${x.parent||'Parent'}, ${x.name} ki ${x.month||''} academy fee ₹${Number(x.pending_amount).toLocaleString('en-IN')} pending hai. Kripya fee jama kar dein. Dhanyavaad.`;return `<tr><td>${esc(x.month||'')}</td><td>${esc(x.name)}</td><td>${esc(x.parent||'')}</td><td>${esc(x.mobile||'')}</td><td>${money(x.pending_amount)}</td><td><a class="wa" target="_blank" href="https://wa.me/${ph}?text=${encodeURIComponent(m)}">Open WhatsApp</a></td></tr>`}).join('')||'<tr><td colspan=6>No pending fees</td></tr>'}
async function staff(){let s=await api('/api/staff');$('staffRows').innerHTML=s.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.mobile||'')}</td><td>${esc(x.role||'')}</td><td>${esc(x.joining_date||'')}</td><td>${esc(x.status)}</td><td>${x.username?esc(x.username):'—'}</td><td><button class="danger" onclick="delStaff(${x.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan=7>No staff</td></tr>';$('attstaff').innerHTML=s.filter(x=>x.status==='Active').map(x=>`<option value="${x.id}">${esc(x.name)} (${esc(x.role||'Staff')})</option>`).join('')}
async function addStaff(){await api('/api/staff',{method:'POST',body:JSON.stringify({name:$('stname').value,mobile:$('stmobile').value,role:$('strole').value,joining_date:$('stjoin').value,username:$('stuser').value,password:$('stpass').value})});staff();dash();alert('Staff account created')}
async function delStaff(id){if(confirm('Delete staff, login and attendance records?')){await api('/api/staff/'+id,{method:'DELETE'});staff();dash();loadAttendance()}}
async function markStaffAttendance(){await api('/api/staff-attendance',{method:'POST',body:JSON.stringify({staff_id:$('attstaff').value,date:$('attdate').value,status:$('attstatus').value,check_in:$('checkin').value,check_out:$('checkout').value,remarks:$('attremarks').value})});loadAttendance();alert('Attendance saved')}
async function markMyAttendance(){await api('/api/staff-attendance',{method:'POST',body:JSON.stringify({staff_id:ME.staffId,date:$('attdate').value,status:$('attstatus').value,check_in:$('checkin').value,check_out:$('checkout').value,remarks:$('attremarks').value})});loadAttendance();alert('Attendance saved')}
async function loadAttendance(){let q=$('reportdate')?.value||'';let r=await api('/api/staff-attendance'+(q?'?date='+encodeURIComponent(q):''));if(ME.role==='admin')$('attRows').innerHTML=r.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.role||'')}</td><td>${esc(x.status)}</td><td>${esc(x.check_in||'')}</td><td>${esc(x.check_out||'')}</td><td>${esc(x.remarks||'')}</td></tr>`).join('')||'<tr><td colspan=7>No attendance records</td></tr>';else $('attRows').innerHTML=r.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.status)}</td><td>${esc(x.check_in||'')}</td><td>${esc(x.check_out||'')}</td><td>${esc(x.remarks||'')}</td></tr>`).join('')||'<tr><td colspan=5>No attendance records</td></tr>'}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
start();
</script></body></html>
